name: DNSHE Auto Renew

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subdomain_id: ["1222375126", "1814581041", "3784124845", "1602329997", "8706361823", "3456659421", "2806128211", "2792033679"]

    outputs:
      res_1222375126: ${{ steps.r1.outputs.resp }}
      res_1814581041: ${{ steps.r2.outputs.resp }}
      res_3784124845: ${{ steps.r3.outputs.resp }}
      res_1602329997: ${{ steps.r4.outputs.resp }}
      res_8706361823: ${{ steps.r5.outputs.resp }}
      res_3456659421: ${{ steps.r6.outputs.resp }}
      res_2806128211: ${{ steps.r7.outputs.resp }}
      res_2792033679: ${{ steps.r8.outputs.resp }}

    steps:
      # 前 4 个域名（含新加的 n7n.cc.cd）：使用 Secrets 变量
      - name: Renew Domain 1222375126
        if: matrix.subdomain_id == '1222375126'
        id: r1
        run: |
          RES=$(curl -s -X POST 'https://api005.dnshe.com/index.php?m=domain_hub&endpoint=subdomains&action=renew' \
            -H 'X-API-Key: ${{ secrets.DNSHE_API_KEY }}' \
            -H 'X-API-Secret: ${{ secrets.DNSHE_API_SECRET }}' \
            -H 'Content-Type: application/json' \
            --data '{"subdomain_id": 1222375126}')
          echo "resp<<EOF" >> $GITHUB_OUTPUT
          echo "$RES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Renew Domain 1814581041
        if: matrix.subdomain_id == '1814581041'
        id: r2
        run: |
          RES=$(curl -s -X POST 'https://api005.dnshe.com/index.php?m=domain_hub&endpoint=subdomains&action=renew' \
            -H 'X-API-Key: ${{ secrets.DNSHE_API_KEY }}' \
            -H 'X-API-Secret: ${{ secrets.DNSHE_API_SECRET }}' \
            -H 'Content-Type: application/json' \
            --data '{"subdomain_id": 1814581041}')
          echo "resp<<EOF" >> $GITHUB_OUTPUT
          echo "$RES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Renew Domain 3784124845
        if: matrix.subdomain_id == '3784124845'
        id: r3
        run: |
          RES=$(curl -s -X POST 'https://api005.dnshe.com/index.php?m=domain_hub&endpoint=subdomains&action=renew' \
            -H 'X-API-Key: ${{ secrets.DNSHE_API_KEY }}' \
            -H 'X-API-Secret: ${{ secrets.DNSHE_API_SECRET }}' \
            -H 'Content-Type: application/json' \
            --data '{"subdomain_id": 3784124845}')
          echo "resp<<EOF" >> $GITHUB_OUTPUT
          echo "$RES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Renew Domain 1602329997 (n7n.cc.cd)
        if: matrix.subdomain_id == '1602329997'
        id: r4
        run: |
          RES=$(curl -s -X POST 'https://api005.dnshe.com/index.php?m=domain_hub&endpoint=subdomains&action=renew' \
            -H 'X-API-Key: ${{ secrets.DNSHE_API_KEY }}' \
            -H 'X-API-Secret: ${{ secrets.DNSHE_API_SECRET }}' \
            -H 'Content-Type: application/json' \
            --data '{"subdomain_id": 1602329997}')
          echo "resp<<EOF" >> $GITHUB_OUTPUT
          echo "$RES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 后 4 个域名：硬编码写入固定的 API 密钥
      - name: Renew Domain 8706361823
        if: matrix.subdomain_id == '8706361823'
        id: r5
        run: |
          RES=$(curl -s -X POST 'https://api005.dnshe.com/index.php?m=domain_hub&endpoint=subdomains&action=renew' \
            -H 'X-API-Key: cfsd_34b8d19b77954dacbfd3318c599b99a1' \
            -H 'X-API-Secret: 6a801f3a37fa41f166c964970049992f2442faa5c6686442ef27e93b17219d71' \
            -H 'Content-Type: application/json' \
            --data '{"subdomain_id": 8706361823}')
          echo "resp<<EOF" >> $GITHUB_OUTPUT
          echo "$RES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Renew Domain 3456659421
        if: matrix.subdomain_id == '3456659421'
        id: r6
        run: |
          RES=$(curl -s -X POST 'https://api005.dnshe.com/index.php?m=domain_hub&endpoint=subdomains&action=renew' \
            -H 'X-API-Key: cfsd_34b8d19b77954dacbfd3318c599b99a1' \
            -H 'X-API-Secret: 6a801f3a37fa41f166c964970049992f2442faa5c6686442ef27e93b17219d71' \
            -H 'Content-Type: application/json' \
            --data '{"subdomain_id": 3456659421}')
          echo "resp<<EOF" >> $GITHUB_OUTPUT
          echo "$RES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Renew Domain 2806128211
        if: matrix.subdomain_id == '2806128211'
        id: r7
        run: |
          RES=$(curl -s -X POST 'https://api005.dnshe.com/index.php?m=domain_hub&endpoint=subdomains&action=renew' \
            -H 'X-API-Key: cfsd_34b8d19b77954dacbfd3318c599b99a1' \
            -H 'X-API-Secret: 6a801f3a37fa41f166c964970049992f2442faa5c6686442ef27e93b17219d71' \
            -H 'Content-Type: application/json' \
            --data '{"subdomain_id": 2806128211}')
          echo "resp<<EOF" >> $GITHUB_OUTPUT
          echo "$RES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Renew Domain 2792033679
        if: matrix.subdomain_id == '2792033679'
        id: r8
        run: |
          RES=$(curl -s -X POST 'https://api005.dnshe.com/index.php?m=domain_hub&endpoint=subdomains&action=renew' \
            -H 'X-API-Key: cfsd_34b8d19b77954dacbfd3318c599b99a1' \
            -H 'X-API-Secret: 6a801f3a37fa41f166c964970049992f2442faa5c6686442ef27e93b17219d71' \
            -H 'Content-Type: application/json' \
            --data '{"subdomain_id": 2792033679}')
          echo "resp<<EOF" >> $GITHUB_OUTPUT
          echo "$RES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  send_summary:
    needs: renew
    runs-on: ubuntu-latest
    steps:
      - name: Send Smart Routed Email
        env:
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          R1: ${{ needs.renew.outputs.res_1222375126 }}
          R2: ${{ needs.renew.outputs.res_1814581041 }}
          R3: ${{ needs.renew.outputs.res_3784124845 }}
          R4: ${{ needs.renew.outputs.res_1602329997 }}
          R5: ${{ needs.renew.outputs.res_8706361823 }}
          R6: ${{ needs.renew.outputs.res_3456659421 }}
          R7: ${{ needs.renew.outputs.res_2806128211 }}
          R8: ${{ needs.renew.outputs.res_2792033679 }}
        run: |
          python3 - <<'EOF'
          import os
          import smtplib
          from email.header import Header
          from email.mime.text import MIMEText

          r1 = os.environ.get("R1", "")
          r2 = os.environ.get("R2", "")
          r3 = os.environ.get("R3", "")
          r4 = os.environ.get("R4", "")
          r5 = os.environ.get("R5", "")
          r6 = os.environ.get("R6", "")
          r7 = os.environ.get("R7", "")
          r8 = os.environ.get("R8", "")

          content = f"""【域名 1222375126 结果】
          {r1}

          【域名 1814581041 结果】
          {r2}

          【域名 3784124845 结果】
          {r3}

          【域名 1602329997 (n7n.cc.cd) 结果】
          {r4}

          【域名 8706361823 结果】
          {r5}

          【域名 3456659421 结果】
          {r6}

          【域名 2806128211 结果】
          {r7}

          【域名 2792033679 (y2y.cc.cd) 结果】
          {r8}"""

          all_responses = [r1, r2, r3, r4, r5, r6, r7, r8]
          
          has_real_error = False
          for resp in all_responses:
              if "renewal_not_yet_available" in resp:
                  continue
              if "error" in resp.lower() or "fail" in resp.lower() or '"success":false' in resp.lower():
                  has_real_error = True
                  break

          mail_host = "smtp.163.com"
          mail_port = 465
          sender = "dd33555583@163.com"
          password = os.environ.get("MAIL_PASS")

          receivers = ["pp33555583@163.com"]
          subject = "📢 DNSHE 域名巡检完整合并报告"

          if has_real_error:
              receivers.append("421402605@qq.com")
              subject = "⚠️【告警】DNSHE 域名续费出现严重异常"
              print("检测到真实错误异常，已抄送至 QQ 邮箱！")
          else:
              print("所有域名状态正常或处于不在续费期，仅发送至 pp33555583@163.com。")

          message = MIMEText(content, "plain", "utf-8")
          message['From'] = Header(sender, 'utf-8')
          message['To'] = Header(", ".join(receivers), 'utf-8')
          message['Subject'] = Header(subject, 'utf-8')

          try:
              smtp_obj = smtplib.SMTP_SSL(mail_host, mail_port)
              smtp_obj.login(sender, password)
              smtp_obj.sendmail(sender, receivers, message.as_string())
              smtp_obj.quit()
              print("邮件发送成功！")
          except Exception as e:
              print(f"邮件发送失败: {e}")
              exit(1)
          EOF
