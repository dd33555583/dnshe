def process_domains(api_key, api_secret, domains, group_name):
    print(f"\n=== 开始执行: {group_name} (共 {len(domains)} 个域名) ===")
    for item in domains:
        domain_name = item["name"]
        domain_id = item["id"]
        
        # 拼接续期请求 URL
        url = f"https://my.dnshe.com/index.php?id=9&m=domain_hub&view=domain&domain_id={domain_id}"
        
        # 根据你原有的鉴权方式（若新旧账号验证头有区别可在这里微调）
        headers = {
            "Cookie": f"api_key={api_key}"
        }
        
        try:
            response = requests.get(url, headers=headers, timeout=10)
            print(f"域名: {domain_name} (ID: {domain_id}) -> 状态码: {response.status_code}")
            
            # 尝试解析返回的 JSON，或者判断是否有内容
            if response.headers.get('content-type', '').startswith('application/json'):
                print(f"  └─ 响应: {response.json()}")
            elif "404" in response.text:
                print(f"  └─ 错误: 返回 404")
        except Exception as e:
            print(f"  └─ 域名 {domain_name} 请求出错: {e}")

