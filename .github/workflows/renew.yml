name: DNSHE Auto Renew

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        domain: ["m8m.cc.cd", "o6o.cc.cd"]
    steps:
      - name: Renew Domain ${{ matrix.domain }}
        run: |
          curl -X POST "https://api005.dnshe.com/index.php?m=domain_hub&endpoint=domain&action=renew&domain=${{ matrix.domain }}" \
            -H "X-API-Key: ${{ secrets.DNSHE_API_KEY }}" \
            -H "X-API-Secret: ${{ secrets.DNSHE_API_SECRET }}"
