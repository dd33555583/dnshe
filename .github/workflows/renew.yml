name: DNSHE Auto Renew

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subdomain_id: ["1222375126", "1814581041", "3784124845"]

    steps:
      - name: Renew Domain ID ${{ matrix.subdomain_id }}
        id: renew_step
        run: |
          RESPONSE=$(curl -s -X POST 'https://api005.dnshe.com/index.php?m=domain_hub&endpoint=subdomains&action=renew' \
            -H 'X-API-Key: ${{ secrets.DNSHE_API_KEY }}' \
            -H 'X-API-Secret: ${{ secrets.DNSHE_API_SECRET }}' \
            -H 'Content-Type: application/json' \
            --data '{"subdomain_id": ${{ matrix.subdomain_id }}}')
          
          echo "api_response=$RESPONSE" >> $GITHUB_OUTPUT

      - name: Send Status Email (Python)
        env:
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          SUBDOMAIN_ID: ${{ matrix.subdomain_id }}
          API_RESP: ${{ steps.renew_step.outputs.api_response }}
        run: |
          python3 - <<'EOF'
          import os
          import json
          import smtplib
          from email.header import Header
          from email.mime.text import MIMEText

          mail_host = "smtp.163.com"
          mail_port = 465
          sender = "dd33555583@163.com"
          receiver = "421402605@qq.com"
          password = os.environ.get("MAIL_PASS")

          sub_id = os.environ.get("SUBDOMAIN_ID")
          raw_resp = os.environ.get("API_RESP")

          # 尝试解析 JSON 提取剩余天数
          days_info = "未知"
          try:
              data = json.loads(raw_resp)
              # 兼容成功或未到期返回的不同结构
              if "days_until_window" in data:
                  days_info = f"距离可续期还有 {data['days_until_window']} 天"
              elif "remaining_days" in data:
                  days_info = f"剩余有效期 {data['remaining_days']} 天"
              elif "details" in data and "days_until_window" in data["details"]:
                  days_info = f"距离可续期还有 {data['details']['days_until_window']} 天"
          except:
              pass

          subject = f"📢 DNSHE 域名 ({sub_id}) 巡检报告"
          content = f"域名 ID: {sub_id}\n状态说明: {days_info}\n\n完整 API 响应:\n{raw_resp}"

          message = MIMEText(content, "plain", "utf-8")
          message['From'] = Header(sender, 'utf-8')
          message['To'] = Header(receiver, 'utf-8')
          message['Subject'] = Header(subject, 'utf-8')

          try:
              smtp_obj = smtplib.SMTP_SSL(mail_host, mail_port)
              smtp_obj.login(sender, password)
              smtp_obj.sendmail(sender, [receiver], message.as_string())
              smtp_obj.quit()
              print("状态邮件发送成功！")
          except Exception as e:
              print(f"邮件发送失败: {e}")
              exit(1)
          EOF
