def process_domains(api_key, api_secret, domains, group_name):
    print(f"=== 开始执行: {group_name} ===")
    for item in domains:
        domain_name = item["name"]
        domain_id = item["id"]
        
        # 拼接续期请求 URL
        url = f"https://my.dnshe.com/index.php?m=domain_hub&view=domain&domain_id={domain_id}"
        
        # 根据你实际的鉴权方式传入 Key / Secret（这里以 Cookie 或 Headers 形式为例，可按你原脚本微调）
        headers = {
            "Cookie": f"api_key={api_key}"  # 如果需要用到 secret，可在此处扩展
        }
        
        try:
            response = requests.get(url, headers=headers, timeout=10)
            print(f"域名: {domain_name} (ID: {domain_id}) -> 状态码: {response.status_code}")
            
            # 判断是否返回正常的 JSON 或页面
            if response.headers.get('content-type', '').startswith('application/json'):
                print(f"响应内容: {response.json()}")
            elif "404" in response.text:
                print(f"错误: 依然返回 404，请确认权限或请求路径。")
        except Exception as e:
            print(f"域名 {domain_name} 请求出错: {e}")

