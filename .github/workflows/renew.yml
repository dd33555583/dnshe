name: DNSHE Auto Renew

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subdomain_id: ["1222375126", "1814581041", "3784124845"]

    outputs:
      response_${{ matrix.subdomain_id }}: ${{ steps.renew_step.outputs.api_response }}

    steps:
      - name: Renew Domain ID ${{ matrix.subdomain_id }}
        id: renew_step
        run: |
          RESPONSE=$(curl -s -X POST 'https://api005.dnshe.com/index.php?m=domain_hub&endpoint=subdomains&action=renew' \
            -H 'X-API-Key: ${{ secrets.DNSHE_API_KEY }}' \
            -H 'X-API-Secret: ${{ secrets.DNSHE_API_SECRET }}' \
            -H 'Content-Type: application/json' \
            --data '{"subdomain_id": ${{ matrix.subdomain_id }}}')
          
          # 对 GitHub Actions 友好的安全转义，防止 JSON 里的引号或换行打断输出
          SAFE_RESPONSE=$(echo "$RESPONSE" | jq -aRs '.')
          echo "api_response=$SAFE_RESPONSE" >> $GITHUB_OUTPUT
          echo "域名 ${{ matrix.subdomain_id }} 请求完成"

  send_summary:
    needs: renew
    runs-on: ubuntu-latest
    steps:
      - name: Send Combined Summary Email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.163.com
          server_port: 465
          username: dd33555583@163.com
          password: ${{ secrets.MAIL_PASS }}
          subject: "📢 DNSHE 三个域名巡检合并报告"
          body: |
            【域名 1222375126 结果】
            ${{ needs.renew.outputs.response_1222375126 }}

            【域名 1814581041 结果】
            ${{ needs.renew.outputs.response_1814581041 }}

            【域名 3784124845 结果】
            ${{ needs.renew.outputs.response_3784124845 }}
          to: 421402605@qq.com
          from: dd33555583@163.com
