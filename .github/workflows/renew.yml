name: DNSHE Auto Renew

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subdomain_id: ["1222375126", "1814581041", "3784124845"]

    steps:
      - name: Renew Domain ID ${{ matrix.subdomain_id }}
        id: renew_step
        run: |
          RESPONSE=$(curl -s -X POST 'https://api005.dnshe.com/index.php?m=domain_hub&endpoint=subdomains&action=renew' \
            -H 'X-API-Key: ${{ secrets.DNSHE_API_KEY }}' \
            -H 'X-API-Secret: ${{ secrets.DNSHE_API_SECRET }}' \
            -H 'Content-Type: application/json' \
            --data '{"subdomain_id": ${{ matrix.subdomain_id }}}')
          
          echo "api_response=$RESPONSE" >> $GITHUB_OUTPUT
          
          # 只要返回了合法的 JSON 响应（包含 success 或 message 等字段），就视为正常，不触发红叉
          if echo "$RESPONSE" | grep -qE '"success":true|"message":'; then
            echo "域名 ${{ matrix.subdomain_id }} 状态正常响应。"
          else
            echo "域名 ${{ matrix.subdomain_id }} 请求异常！"
            exit 1
          fi

      - name: Send Email on Failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.163.com
          server_port: 465
          username: dd33555583@163.com
          password: ${{ secrets.MAIL_PASS }}
          subject: "⚠️ DNSHE 域名续费异常告警 (ID: ${{ matrix.subdomain_id }})"
          body: "域名 ID: ${{ matrix.subdomain_id }} 发生异常，请及时检查！\n\nAPI 返回的完整原始数据:\n${{ steps.renew_step.outputs.api_response }}"
          to: 421402605@qq.com
          from: dd33555583@163.com
