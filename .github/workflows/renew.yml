name: DNSHE Auto Renew

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subdomain_id: ["1222375126", "1814581041", "3784124845"]

    steps:
      - name: Renew Domain ID ${{ matrix.subdomain_id }}
        id: renew_step
        run: |
          RESPONSE=$(curl -s -X POST 'https://api005.dnshe.com/index.php?m=domain_hub&endpoint=subdomains&action=renew' \
            -H 'X-API-Key: ${{ secrets.DNSHE_API_KEY }}' \
            -H 'X-API-Secret: ${{ secrets.DNSHE_API_SECRET }}' \
            -H 'Content-Type: application/json' \
            --data '{"subdomain_id": ${{ matrix.subdomain_id }}}')
          
          echo "api_response=$RESPONSE" >> $GITHUB_OUTPUT
          echo "API 返回结果: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"success":true'; then
            echo "Domain ${{ matrix.subdomain_id }} renewed successfully."
          else
            echo "Domain ${{ matrix.subdomain_id }} renewal failed or already renewed!"
            # 标记一个自定义错误状态，但不强行让整个 workflow 整体崩溃阻断别的域名
            echo "has_error=true" >> $GITHUB_ENV
          fi

      - name: Send Email on Failure
        if: failure() || env.has_error == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.163.com
          server_port: 465
          username: dd33555583@163.com
          password: ${{ secrets.MAIL_PASS }}
          subject: "⚠️ DNSHE 域名续费提醒/告警"
          body: "域名 ID: ${{ matrix.subdomain_id }} 续费状态异常，请及时检查！\n\nAPI 返回详情: ${{ steps.renew_step.outputs.api_response }}"
          to: 421402605@qq.com
          from: dd33555583@163.com
